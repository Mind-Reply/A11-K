name: reality-proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reality-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reality claims
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate claim registry
        run: python3 scripts/verify_reality_claims.py
