name: Vercel production verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-verification
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production endpoint
        env:
          PRODUCTION_URL: https://a11-k-rho.vercel.app/
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o /tmp/a11k-response.html -w '%{http_code}' --max-time 20 "$PRODUCTION_URL")"
          test "$status" = "200"
          test -s /tmp/a11k-response.html
          echo "A11-K production verification passed: HTTP $status"
