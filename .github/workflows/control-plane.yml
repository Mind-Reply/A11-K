name: control-plane

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: control-plane-${{${ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Reject banned runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE 'WHATSAPP_(TOKEN|ACCESS_TOKEN|VERIFY_TOKEN|APP_SECRET|PHONE|PHONE_NUMBER_ID|RECIPIENT)|whatsapp(-|_|/)?(webhook|bridge|router)' -- app src scripts config; then
            echo 'BANNED: WhatsApp runtime configuration detected.'
            exit 1
          fi

  notify:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RESULT: ${{ needs.verify.result }}
    steps:
      - name: Email control-plane result
        shell: python
        run: |
          import os, smtplib
          from email.message import EmailMessage

          user = os.environ.get('SMTP_USER') or 'mind.repl@gmail.com'
          password = os.environ.get('SMTP_PASSWORD')
          if not password:
              raise SystemExit('SMTP_PASSWORD is not configured; notification cannot be sent.')
          msg = EmailMessage()
          msg['Subject'] = f"A11-K control-plane CI: {os.environ['RESULT']}"
          msg['From'] = user
          msg['To'] = 'mind.repl@gmail.com'
          msg.set_content(f"Result: {os.environ['RESULT']}\nRepository: {os.environ['GITHUB_REPOSITORY']}\nCommit: {os.environ['GITHUB_SHA']}\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=20) as smtp:
              smtp.login(user, password)
              smtp.send_message(msg)