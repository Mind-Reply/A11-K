name: control-plane

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Reject tracked secrets and build artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|\.next/|node_modules/|.*\.log$)' ; then
            echo 'Tracked secret/build/log artifact detected.'
            exit 1
          fi
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo 'Potential credential material detected.'
            exit 1
          fi

  slack:
    needs: verify
    if: ${{ always() && secrets.SLACK_WEBHOOK_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Post CI result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ needs.verify.result }}
        run: |
          payload=$(printf '{"text":"A11-K control-plane CI: %s | %s"}' "$RESULT" "$GITHUB_SHA")
          curl --fail-with-body -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
