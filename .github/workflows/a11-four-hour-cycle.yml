name: A11 Four-Hour Operating Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '11 */4 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: a11-four-hour-cycle
  cancel-in-progress: true

jobs:
  cycle:
    name: A11 evidence and knowledge cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify A11 operating contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/A11_SKILLS.md
          test -f docs/A11_KNOWLEDGE_BASE.md
          test -f docs/IDENTITY.md
          test -f README.md

      - name: Build cycle evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/a11-four-hour
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          file="evidence/a11-four-hour/${ts//:/-}.md"
          {
            echo '# A11 Four-Hour Cycle'
            echo
            echo "Timestamp: $ts"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo '## Verified checks'
            echo '- A11 skills register present'
            echo '- A11 knowledge base present'
            echo '- Identity contract present'
            echo '- README present'
            echo '- Repository working tree inspected'
            echo
            echo '## Operating focus'
            echo 'Prioritise the smallest useful real change across public evidence, discoverability, commercial readiness, reliability, or knowledge.'
            echo
            echo '## External action boundary'
            echo 'This scheduled cycle does not send external messages, alter billing, rotate secrets, or make irreversible cloud changes.'
            echo
            echo '## Status'
            echo 'READY — scheduled evidence/maintenance cycle.'
          } > "$file"

      - name: Publish evidence as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: a11-four-hour-cycle-${{ github.run_number }}
          path: evidence/a11-four-hour/
          retention-days: 14

      - name: Record exception
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title 'A11 four-hour cycle exception' \
            --body "Automated A11 cycle failed at ${GITHUB_SHA}. Human review required; no automatic remediation is performed."
