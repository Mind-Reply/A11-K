name: Autonomous cloud brain guardrails

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-cloud-brain
  cancel-in-progress: true

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production surface
        env:
          PRODUCTION_URL: https://chat.a11-k.space/
        run: |
          set -euo pipefail
          started=$(date +%s%3N)
          status="$(curl -L -sS -D /tmp/headers.txt -o /tmp/response.html -w '%{http_code}' --max-time 20 "$PRODUCTION_URL")"
          finished=$(date +%s%3N)
          latency="$((finished-started))ms"
          test "$status" = "200"
          test -s /tmp/response.html
          grep -qi "A11-K" /tmp/response.html
          echo "## Runtime verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP status: $status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Latency: $latency" >> "$GITHUB_STEP_SUMMARY"
          echo "- Correlation: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify security headers
        run: |
          set -euo pipefail
          curl -L -sS -D /tmp/headers.txt -o /dev/null --max-time 20 https://chat.a11-k.space/
          grep -Eiq '^strict-transport-security:' /tmp/headers.txt
          grep -Eiq '^x-content-type-options:' /tmp/headers.txt
          echo "## Security headers" >> "$GITHUB_STEP_SUMMARY"
          echo "- HSTS present" >> "$GITHUB_STEP_SUMMARY"
          echo "- X-Content-Type-Options present" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify automation contracts
        run: |
          set -euo pipefail
          test -d .github/workflows
          test -f .github/workflows/resellerpro-release.yml
          test -f .github/workflows/autonomous-contract-check.yml
          echo "## Automation contracts" >> "$GITHUB_STEP_SUMMARY"
          echo "- ResellerPro release workflow present" >> "$GITHUB_STEP_SUMMARY"
          echo "- Autonomous contract check present" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify communication and secret invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -d .next
          test -f .gitignore
          if git grep -nIE 'WHATSAPP_(TOKEN|ACCESS_TOKEN|VERIFY_TOKEN|APP_SECRET|PHONE|PHONE_NUMBER_ID|RECIPIENT)|hooks\.slack\.com|SLACK_WEBHOOK|PAGERDUTY' -- ':!app/api/webhook/whatsapp/route.ts' ':!.github/workflows/control-plane.yml' ':!.github/workflows/resellerpro-release.yml' ':!.github/workflows/autonomous-cloud-brain.yml'; then
            echo 'BANNED communication configuration detected.'
            exit 1
          fi
          grep -RIn 'mind\.repl@gmail\.com' .github/workflows >/dev/null

      - name: Verify repository safety invariants
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -d .next
          test -f .gitignore
          echo "## Safety invariants" >> "$GITHUB_STEP_SUMMARY"
          echo "- No committed .env file" >> "$GITHUB_STEP_SUMMARY"
          echo "- No committed .next directory" >> "$GITHUB_STEP_SUMMARY"
          echo "- .gitignore present" >> "$GITHUB_STEP_SUMMARY"
