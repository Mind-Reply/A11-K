name: Flight Deck Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '53 * * * *'
permissions:
  contents: read
  issues: write
jobs:
  watch:
    name: Watchkeeper / owner-control pulse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify flight-deck contract
        run: test -f docs/IDENTITY.md
      - name: Inspect operational surface
        run: |
          git log -5 --oneline
          find .github -maxdepth 2 -type f -print 2>/dev/null | sort
      - name: Open exception note
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Flight Deck exception" --body "The hourly Watchkeeper found an operational contract failure. Human approval is required for any remediation." || true
