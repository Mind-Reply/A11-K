name: Deploy A11-K Unified to Vercel + Docker (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_A11K }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        timeout-minutes: 15

      - name: Build
        run: npm run build
        timeout-minutes: 15

      - name: Deploy to Vercel
        uses: vercel/action@v4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_A11K }}
          production: true

      - name: Verify Deployment
        run: |
          echo "✅ A11-K Unified deployed successfully!"
          echo ""
          echo "📍 Live URLs:"
          echo "  • a11-k.space (primary)"
          echo "  • akrobotics-nomrdbew.manus.space (secondary)"
          echo ""
          echo "🐳 Docker Compose Stack:"
          echo "  • Nowline (3001)"
          echo "  • MindReply (3000)"
          echo "  • Real Estate Radar (3002)"
          echo "  • OTA Suite (3003/5000)"
          echo "  • PostgreSQL (5432)"
          echo "  • Redis (6379)"
          echo "  • Grafana (3100)"

      - name: Notify Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '✅ A11-K Unified deployed to production'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ A11-K Unified deployment failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
