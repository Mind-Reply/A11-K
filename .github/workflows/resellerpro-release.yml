name: A11-K → ResellerPro Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: resellerpro-release-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mind-reply/a11-k

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Docker build
        run: docker build --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:main" .
      - name: Docker health contract
        run: |
          docker run -d --name a11k-release -p 18080:8080 "$IMAGE:${{ github.sha }}"
          trap 'docker rm -f a11k-release >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz; then
              echo
              echo "A11-K container health verified."
              exit 0
            fi
            sleep 2
          done
          docker logs a11k-release
          exit 1

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable release
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main

  deploy-resellerpro:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESELLERPRO_SSH_HOST: ${{ secrets.RESELLERPRO_SSH_HOST }}
      RESELLERPRO_SSH_USER: ${{ secrets.RESELLERPRO_SSH_USER }}
      RESELLERPRO_SSH_PRIVATE_KEY: ${{ secrets.RESELLERPRO_SSH_PRIVATE_KEY }}
      RESELLERPRO_DEPLOY_PATH: ${{ secrets.RESELLERPRO_DEPLOY_PATH }}
    steps:
      - name: Fail closed when deployment target is not configured
        run: |
          if [ -z "$RESELLERPRO_SSH_HOST" ] || [ -z "$RESELLERPRO_SSH_USER" ] || [ -z "$RESELLERPRO_SSH_PRIVATE_KEY" ] || [ -z "$RESELLERPRO_DEPLOY_PATH" ]; then
            echo "ResellerPro deployment target is not configured."
            echo "Release image was published and validated; production deployment was not attempted."
            exit 0
          fi
      - name: Install SSH tooling
        if: env.RESELLERPRO_SSH_HOST != ''
        run: sudo apt-get update && sudo apt-get install -y openssh-client
      - name: Deploy immutable image to ResellerPro host
        if: env.RESELLERPRO_SSH_HOST != ''
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s
' "$RESELLERPRO_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$RESELLERPRO_SSH_HOST" >> ~/.ssh/known_hosts
          ssh "$RESELLERPRO_SSH_USER@$RESELLERPRO_SSH_HOST" "mkdir -p '$RESELLERPRO_DEPLOY_PATH'"
          ssh "$RESELLERPRO_SSH_USER@$RESELLERPRO_SSH_HOST" "cd '$RESELLERPRO_DEPLOY_PATH' && printf '%s
' '$IMAGE_REF' > .a11k-image"
          ssh "$RESELLERPRO_SSH_USER@$RESELLERPRO_SSH_HOST" "docker pull '$IMAGE_REF'"
          ssh "$RESELLERPRO_SSH_USER@$RESELLERPRO_SSH_HOST" "docker rm -f a11k 2>/dev/null || true"
          ssh "$RESELLERPRO_SSH_USER@$RESELLERPRO_SSH_HOST" "docker run -d --restart unless-stopped --name a11k -p 8080:8080 '$IMAGE_REF'"
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error "http://$RESELLERPRO_SSH_HOST:8080/healthz"; then
              echo
              echo "VERIFIED: ResellerPro host returned HTTP 200 from A11-K /healthz."
              exit 0
            fi
            sleep 3
          done
          echo "Deployment did not produce a verified health response."
          exit 1
