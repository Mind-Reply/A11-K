name: Revenue Determinism Guard

on:
  push:
    branches: [main]
    paths:
      - 'src/revenue/**'
      - 'tests/revenue-**'
      - 'revenue-action-policy.json'
      - 'docs/REVENUE_AUTONOMY_CANON.md'
      - '.github/workflows/revenue-determinism.yml'
  pull_request:
    paths:
      - 'src/revenue/**'
      - 'tests/revenue-**'
      - 'revenue-action-policy.json'
      - 'docs/REVENUE_AUTONOMY_CANON.md'
      - '.github/workflows/revenue-determinism.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-revenue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run revenue tests
        run: node --test tests/revenue-engine.test.mjs

      - name: Assert revenue policy is model-optional
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const policy = JSON.parse(fs.readFileSync('revenue-action-policy.json', 'utf8'));
          if (policy.model_dependency !== 'optional') throw new Error('Revenue policy must remain model-optional');
          if (policy.default_mode !== 'deterministic') throw new Error('Revenue default mode must remain deterministic');
          const forbidden = new Set(policy.model_must_not_be_required_for || []);
          for (const action of ['price_calculation','order_creation','entitlement_grant','settlement_calculation','ledger_posting','reconciliation','revenue_reporting']) {
            if (!forbidden.has(action)) throw new Error(`Missing model-independent hard boundary: ${action}`);
          }
          console.log('Revenue determinism policy: PASS');
          NODE

      - name: Block secrets from revenue source
        run: |
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,})' src/revenue revenue-action-policy.json 2>/dev/null; then
            echo 'Potential secret detected in revenue-critical source.'
            exit 1
          fi
          echo 'Revenue source secret scan: PASS'
