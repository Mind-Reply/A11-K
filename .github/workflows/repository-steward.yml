name: Repository Steward

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-steward
  cancel-in-progress: true

jobs:
  steward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Inspect A11-K
        shell: bash
        run: |
          set -u
          {
            echo "repo=$GITHUB_REPOSITORY sha=$GITHUB_SHA utc=$(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "node=$(node --version) npm=$(npm --version)"
            echo '--- workflow inventory ---'
            find .github/workflows -maxdepth 1 -type f -print | sort
            echo '--- source inventory ---'
            find . -maxdepth 3 -type f -not -path './.git/*' -not -path './node_modules/*' | sort | head -200
            if find . -type f -not -path './.git/*' -not -path './node_modules/*' -print0 | xargs -0 grep -IlE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|sk-[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9]{20,})' 2>/dev/null | head -20 | grep -q .; then
              echo 'SECRET_SIGNAL=possible-hardcoded-secret'
            else
              echo 'SECRET_SIGNAL=none-detected'
            fi
          } > steward-report.md
          cat steward-report.md

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

      - name: Alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q 'SECRET_SIGNAL=possible-hardcoded-secret' steward-report.md; then
            gh issue list --state open --search 'Steward alert: possible secret exposure in:title' --json number --jq '.[0].number' | grep -q . || \
              gh issue create --title 'Steward alert: possible secret exposure' --body 'Hourly steward detected a credential-like string. Review before changing code.'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: steward-report-${{ github.run_id }}
          path: steward-report.md
          retention-days: 7
