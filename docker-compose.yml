version: '3.9'

services:
  ledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sofia-tech-ledger
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - STL_OUT_DIR=/app/output
      # Optional: Override these at runtime for live data fetching
      # - STL_LIVE=1
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      # - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}
    volumes:
      # Persist ledger output across container restarts
      - ledger-output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ledger-output:
    driver: local
